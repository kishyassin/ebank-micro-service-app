spring.application.name=ebank-chatbot
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
server.port=8083
spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8081/mcp
spring.ai.mcp.client.streamable-http.connections.account.url=http://localhost:8082/mcp
